name: VaultBasis Industrial Validation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: 11-Gate Integrity Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Release content gate (claims + quickstart shell bans)
      run: python3 scripts/check_release_content.py

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install fastapi uvicorn jsonschema pytest httpx python-multipart pydantic starlette; fi

    - name: Install Node.js dependencies
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
    - run: npm install

    - name: Execute Left-Shift Validation Pipeline
      run: |
        chmod +x scripts/validate_before_commit.sh
        chmod 600 tests/fixtures/keys/*.key || true
        ./scripts/validate_before_commit.sh

  release-desktop:
    name: Build Encrypted Desktop Executables
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies (including PyInstaller and tinyaes)
      run: pip install -r requirements.txt

    - name: Compile strictly obfuscated binary
      run: python scripts/build_desktop_executable.py

    - name: Upload Secure Bundle to Workflow Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vaultbasis-edge-bundle-${{ matrix.os }}
        path: dist/*-Release.zip
        retention-days: 7

  rc3-candidates:
    name: RC3 Candidate Packages (NOT qualified releases)
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: scripts/build_rc3_macos.py
          - os: windows-latest
            script: scripts/build_rc3_windows.py
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Assemble RC3 candidate package
      run: python ${{ matrix.script }}

    - name: ZIP content gate (banned filenames + claims + shell bans in Quick Start)
      shell: bash
      run: |
        for z in dist/VaultBasis-RC3-*.zip; do
          echo "Inspecting $z"
          python3 scripts/check_release_content.py "$z"
        done

    - name: Upload RC3 candidate (7-day workflow artifact, NOT a release)
      uses: actions/upload-artifact@v4
      with:
        name: vaultbasis-rc3-candidate-${{ matrix.os }}
        path: dist/VaultBasis-RC3-*
        retention-days: 7

  promote-rc3:
    name: Promote RC3 to UAT Pre-Release
    needs: [rc3-candidates]
    runs-on: ubuntu-latest
    concurrency:
      group: promote-rc3
      cancel-in-progress: true
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download macOS RC3 candidate
      uses: actions/download-artifact@v4
      with:
        name: vaultbasis-rc3-candidate-macos-latest
        path: downloaded/macos

    - name: Download Windows RC3 candidate
      uses: actions/download-artifact@v4
      with:
        name: vaultbasis-rc3-candidate-windows-latest
        path: downloaded/windows

    - name: Compute SHA-256 and locate ZIPs
      id: hashes
      run: |
        MAC_ZIP=$(find downloaded/macos -name "VaultBasis-RC3-macOS-arm64.zip" | head -1)
        WIN_ZIP=$(find downloaded/windows -name "VaultBasis-RC3-Windows-x64.zip" | head -1)
        if [ -z "$MAC_ZIP" ]; then echo "❌ macOS ZIP not found"; exit 1; fi
        if [ -z "$WIN_ZIP" ]; then echo "❌ Windows ZIP not found"; exit 1; fi
        echo "mac_zip=$MAC_ZIP" >> $GITHUB_OUTPUT
        echo "win_zip=$WIN_ZIP" >> $GITHUB_OUTPUT
        MAC_SHA=$(python3 -c "
        import hashlib, sys
        h = hashlib.sha256()
        with open(sys.argv[1], 'rb') as f:
            for chunk in iter(lambda: f.read(1 << 20), b''):
                h.update(chunk)
        print(h.hexdigest())
        " "$MAC_ZIP")
        WIN_SHA=$(python3 -c "
        import hashlib, sys
        h = hashlib.sha256()
        with open(sys.argv[1], 'rb') as f:
            for chunk in iter(lambda: f.read(1 << 20), b''):
                h.update(chunk)
        print(h.hexdigest())
        " "$WIN_ZIP")
        echo "mac_sha=$MAC_SHA" >> $GITHUB_OUTPUT
        echo "win_sha=$WIN_SHA" >> $GITHUB_OUTPUT
        echo "MAC SHA-256: $MAC_SHA"
        echo "WIN SHA-256: $WIN_SHA"

    - name: ZIP content gate — macOS
      run: python3 scripts/check_release_content.py "${{ steps.hashes.outputs.mac_zip }}"

    - name: ZIP content gate — Windows
      run: python3 scripts/check_release_content.py "${{ steps.hashes.outputs.win_zip }}"

    - name: Create or replace GitHub pre-release rc3-uat-candidate
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view rc3-uat-candidate --repo ${{ github.repository }} > /dev/null 2>&1; then
          gh release delete rc3-uat-candidate --repo ${{ github.repository }} --yes --cleanup-tag
        fi
        gh release create rc3-uat-candidate \
          --repo ${{ github.repository }} \
          --title "RC3 UAT Candidate (Internal — Not for Distribution)" \
          --notes "Automated pre-release from CI run ${{ github.run_id }}, commit ${{ github.sha }}. Design-partner UAT only. UNSIGNED / NOT FOR PUBLIC DISTRIBUTION." \
          --prerelease \
          "${{ steps.hashes.outputs.mac_zip }}#VaultBasis-RC3-macOS-arm64.zip" \
          "${{ steps.hashes.outputs.win_zip }}#VaultBasis-RC3-Windows-x64.zip"

    - name: Write and commit rc3-uat-manifest.json
      env:
        MAC_SHA: ${{ steps.hashes.outputs.mac_sha }}
        WIN_SHA: ${{ steps.hashes.outputs.win_sha }}
      run: |
        python3 - <<'PYEOF'
        import json, os
        manifest = {
          "release_tag": "rc3-uat-candidate",
          "source_commit": os.environ["GITHUB_SHA"],
          "ci_run_id": os.environ["GITHUB_RUN_ID"],
          "artifacts": [
            {
              "filename": "VaultBasis-RC3-macOS-arm64.zip",
              "os": "macos",
              "architecture": "arm64",
              "sha256": os.environ["MAC_SHA"],
              "content_gate": "PASS",
              "qualification": "UAT-READY"
            },
            {
              "filename": "VaultBasis-RC3-Windows-x64.zip",
              "os": "windows",
              "architecture": "x64",
              "sha256": os.environ["WIN_SHA"],
              "content_gate": "PASS",
              "qualification": "UAT-READY"
            }
          ]
        }
        with open("schemas/release/rc3-uat-manifest.json", "w") as f:
            json.dump(manifest, f, indent=2)
            f.write("\n")
        print("Manifest written.")
        PYEOF
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add schemas/release/rc3-uat-manifest.json
        git diff --cached --quiet && echo "No manifest change." || \
          git commit -m "ci: update rc3-uat-manifest for run ${{ github.run_id }} [skip ci]"
        git push

