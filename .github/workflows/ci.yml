name: VaultBasis Industrial Validation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: 11-Gate Integrity Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install fastapi uvicorn jsonschema pytest httpx python-multipart pydantic starlette; fi

    - name: Install Node.js dependencies
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
    - run: npm install

    - name: Execute Left-Shift Validation Pipeline
      run: |
        chmod +x scripts/validate_before_commit.sh
        ./scripts/validate_before_commit.sh
