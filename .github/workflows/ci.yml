name: VaultBasis Industrial Validation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote BUILD_VERIFIED RC3 artifacts to Private Blob storage (explicit promotion — not automatic)"
        type: boolean
        required: true
        default: false

jobs:
  validate:
    name: 11-Gate Integrity Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Release content gate (claims + quickstart shell bans)
      run: python3 scripts/check_release_content.py

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install fastapi uvicorn jsonschema pytest httpx python-multipart pydantic starlette; fi

    - name: Install Node.js dependencies
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
    - run: npm install

    - name: Execute Left-Shift Validation Pipeline
      run: |
        chmod +x scripts/validate_before_commit.sh
        chmod 600 tests/fixtures/keys/*.key || true
        ./scripts/validate_before_commit.sh

  release-desktop:
    name: Build Encrypted Desktop Executables
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies (including PyInstaller and tinyaes)
      run: pip install -r requirements.txt

    - name: Compile strictly obfuscated binary
      run: python scripts/build_desktop_executable.py

    - name: Upload Secure Bundle to Workflow Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vaultbasis-edge-bundle-${{ matrix.os }}
        path: dist/*-Release.zip
        retention-days: 7

  rc3-candidates:
    name: RC3 Candidate Packages (NOT qualified releases)
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: scripts/build_rc3_macos.py
          - os: windows-latest
            script: scripts/build_rc3_windows.py
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Assemble RC3 candidate package
      run: python ${{ matrix.script }}

    - name: ZIP content gate (banned filenames + claims + shell bans in Quick Start)
      shell: bash
      run: |
        for z in dist/VaultBasis-RC3-*.zip; do
          echo "Inspecting $z"
          python3 scripts/check_release_content.py "$z"
        done

    - name: Upload RC3 candidate (7-day workflow artifact, NOT a release)
      uses: actions/upload-artifact@v4
      with:
        name: vaultbasis-rc3-candidate-${{ matrix.os }}
        path: dist/VaultBasis-RC3-*
        retention-days: 7

  inspect-rc3:
    name: RC3 Candidate Inspection (BUILD_VERIFIED — not UAT-READY)
    needs: [rc3-candidates]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download macOS RC3 candidate
      uses: actions/download-artifact@v4
      with:
        name: vaultbasis-rc3-candidate-macos-latest
        path: downloaded/macos

    - name: Download Windows RC3 candidate
      uses: actions/download-artifact@v4
      with:
        name: vaultbasis-rc3-candidate-windows-latest
        path: downloaded/windows

    - name: Inspect both candidates and emit build-verified report
      run: |
        python3 - <<'PYEOF'
        import hashlib, json, os, subprocess, sys, zipfile
        from pathlib import Path

        def sha256(path):
            h = hashlib.sha256()
            with open(path, 'rb') as f:
                for chunk in iter(lambda: f.read(1 << 20), b''):
                    h.update(chunk)
            return h.hexdigest()

        def find_zip(root, pattern):
            for p in Path(root).rglob(pattern):
                return p
            return None

        mac_zip = find_zip('downloaded/macos', 'VaultBasis-RC3-macOS-arm64.zip')
        win_zip = find_zip('downloaded/windows', 'VaultBasis-RC3-Windows-x64.zip')

        results = []
        for label, zpath, expected_arch in [
            ('macOS arm64', mac_zip, 'arm64'),
            ('Windows x64', win_zip, 'x64'),
        ]:
            if not zpath:
                results.append({'target': label, 'status': 'MISSING', 'error': 'ZIP not found in artifact'})
                continue

            r = {'target': label, 'filename': zpath.name, 'sha256': sha256(zpath)}

            # ZIP content gate
            gate = subprocess.run(
                [sys.executable, 'scripts/check_release_content.py', str(zpath)],
                capture_output=True, text=True
            )
            r['content_gate'] = 'PASS' if gate.returncode == 0 else 'FAIL'
            r['content_gate_output'] = (gate.stdout + gate.stderr).strip()

            # ZIP member inspection
            with zipfile.ZipFile(zpath) as zf:
                names = zf.namelist()
                r['has_quick_start'] = any('VaultBasis-Quick-Start.html' in n for n in names)
                r['has_obsolete_guide'] = any('VaultBasis_Quick_Start_Guide' in n for n in names)
                r['has_rc1_content'] = any('RC1' in n or 'preview-macOS' in n for n in names)
                r['has_troubleshooting'] = any('Troubleshooting' in n for n in names)
                r['has_release_txt'] = any('RELEASE.txt' in n for n in names)

                # Architecture check
                if expected_arch == 'arm64':
                    binary_members = [n for n in names if n.endswith('/MacOS/VaultBasis')]
                    r['has_app_bundle'] = any('.app/Contents/MacOS/VaultBasis' in n for n in names)
                    if binary_members:
                        data = zf.read(binary_members[0])
                        # Mach-O arm64: magic 0xFEEDFACF, cpu_type 0x0100000C
                        r['arch_check'] = 'arm64' if data[:4] == b'\xcf\xfa\xed\xfe' and data[4:8] == b'\x0c\x00\x00\x01' else 'UNEXPECTED'
                    else:
                        r['arch_check'] = 'BINARY_NOT_FOUND'
                elif expected_arch == 'x64':
                    exe_members = [n for n in names if n.endswith('VaultBasis.exe')]
                    r['has_exe'] = bool(exe_members)
                    if exe_members:
                        data = zf.read(exe_members[0])
                        # PE x64: MZ header + PE signature + machine 0x8664
                        try:
                            pe_offset = int.from_bytes(data[0x3C:0x40], 'little')
                            machine = int.from_bytes(data[pe_offset+4:pe_offset+6], 'little')
                            r['arch_check'] = 'x64' if machine == 0x8664 else f'UNEXPECTED_MACHINE_{hex(machine)}'
                        except Exception as e:
                            r['arch_check'] = f'PE_PARSE_ERROR: {e}'
                    else:
                        r['arch_check'] = 'EXE_NOT_FOUND'

            # Overall candidate state
            gate_ok = r['content_gate'] == 'PASS'
            arch_ok = r.get('arch_check') == expected_arch
            qs_ok = r['has_quick_start'] and not r['has_obsolete_guide'] and not r['has_rc1_content']
            r['qualification'] = 'BUILD_VERIFIED' if (gate_ok and arch_ok and qs_ok) else 'BLOCKED'
            if not gate_ok: r.setdefault('blockers', []).append('content gate FAIL')
            if not arch_ok: r.setdefault('blockers', []).append(f'arch check: {r.get("arch_check")}')
            if not r['has_quick_start']: r.setdefault('blockers', []).append('canonical Quick Start missing')
            if r['has_obsolete_guide']: r.setdefault('blockers', []).append('obsolete dark guide present')
            if r['has_rc1_content']: r.setdefault('blockers', []).append('RC1/preview-macOS content present')

            results.append(r)

        # Emit verified-identities.json for store-rc3 to consume — eliminates
        # the manually maintained hardcoded hash table in the promotion job.
        identities = {r['target']: r['sha256'] for r in results if 'sha256' in r}
        identities['source_commit'] = os.environ['GITHUB_SHA']
        identities['ci_run_id'] = os.environ['GITHUB_RUN_ID']
        with open('verified-identities.json', 'w') as f:
            import json as _json
            _json.dump(identities, f, indent=2)
        print('verified-identities.json written')

        # Emit GitHub Step Summary
        summary = ['# RC3 Candidate Inspection Report', '',
                   f'Source commit: `{os.environ["GITHUB_SHA"]}`',
                   f'CI run: `{os.environ["GITHUB_RUN_ID"]}`', '',
                   '> **Classification: BUILD_VERIFIED** — content gate, architecture checks,',
                   '> and native platform launch gates (pre-ZIP and post-ZIP extraction) passed.',
                   '> UAT-READY requires additional human-verified qualification gates (smoke, clean-machine).',
                   '']
        for r in results:
            s = r.get('qualification', 'MISSING')
            icon = '✅' if s == 'BUILD_VERIFIED' else '❌'
            summary.append(f'## {icon} {r["target"]} — {s}')
            if 'filename' in r:
                summary.append(f'- **File:** `{r["filename"]}`')
                summary.append(f'- **SHA-256:** `{r["sha256"]}`')
                summary.append(f'- **Content gate:** {r["content_gate"]}')
                summary.append(f'- **Architecture:** {r.get("arch_check", "N/A")}')
                summary.append(f'- **App bundle (.app):** {r.get("has_app_bundle", "N/A")}')
                summary.append(f'- **Exe present:** {r.get("has_exe", "N/A")}')
                summary.append(f'- **Canonical Quick Start:** {r["has_quick_start"]}')
                summary.append(f'- **Obsolete guide absent:** {not r["has_obsolete_guide"]}')
                summary.append(f'- **RC1 content absent:** {not r["has_rc1_content"]}')
                summary.append(f'- **Troubleshooting present:** {r["has_troubleshooting"]}')
                summary.append(f'- **RELEASE.txt present:** {r["has_release_txt"]}')
            if r.get('blockers'):
                summary.append(f'- **BLOCKERS:** {", ".join(r["blockers"])}')
            summary.append('')

        summary.append('## Next required gates before UAT-READY')
        summary.append('- [ ] Clean-machine launch (no developer intervention)')
        summary.append('- [ ] Sample case → finding → receipt → verification')
        summary.append('- [ ] No CWD/repository dependency')
        summary.append('- [ ] Signing/notarization state explicitly recorded')
        summary.append('- [ ] Human review of this report → explicit UAT-READY promotion decision')

        step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
        if step_summary:
            with open(step_summary, 'w') as f:
                f.write('\n'.join(summary))

        # Print to log too
        print('\n'.join(summary))

        # Exit non-zero if any candidate is BLOCKED or MISSING
        blocked = [r for r in results if r.get('qualification') not in ('BUILD_VERIFIED',)]
        if blocked:
            print(f'\n❌ {len(blocked)} candidate(s) BLOCKED — see report above')
            sys.exit(1)

        print('\n✅ Both candidates BUILD_VERIFIED. Retrieve artifacts from this run for human review and UAT qualification.')
        PYEOF

    - name: Upload verified identities for promotion job
      uses: actions/upload-artifact@v4
      with:
        name: vaultbasis-rc3-verified-identities
        path: verified-identities.json
        retention-days: 7

  store-rc3:
    name: Promote BUILD_VERIFIED Artifacts to Private Blob Storage
    needs: [inspect-rc3]
    runs-on: ubuntu-latest
    # Promotion is explicit — must be triggered via workflow_dispatch with promote: true.
    # Automatic pushes to main never promote artifacts; inspect-rc3 still runs automatically.
    if: github.event_name == 'workflow_dispatch' && inputs.promote == true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download macOS RC3 candidate
      uses: actions/download-artifact@v4
      with:
        name: vaultbasis-rc3-candidate-macos-latest
        path: downloaded/macos

    - name: Download Windows RC3 candidate
      uses: actions/download-artifact@v4
      with:
        name: vaultbasis-rc3-candidate-windows-latest
        path: downloaded/windows

    - name: Download verified identities from inspection job
      uses: actions/download-artifact@v4
      with:
        name: vaultbasis-rc3-verified-identities
        path: downloaded/identities

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install @vercel/blob
      run: npm install @vercel/blob

    - name: Upload artifacts to private Blob and write manifest
      env:
        BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      run: |
        node - <<'JSEOF'
        const { put } = require('@vercel/blob');
        const fs = require('fs');
        const path = require('path');
        const crypto = require('crypto');

        function sha256File(filePath) {
          return crypto.createHash('sha256').update(fs.readFileSync(filePath)).digest('hex');
        }

        function findFile(dir, pattern) {
          const files = fs.readdirSync(dir, { recursive: true });
          for (const f of files) {
            if (f.includes(pattern)) return path.join(dir, f);
          }
          return null;
        }

        const COMMIT = process.env.GITHUB_SHA;
        const SHORT_COMMIT = COMMIT.slice(0, 7);
        const RUN_ID = process.env.GITHUB_RUN_ID;
        const PROMOTED_AT = new Date().toISOString();

        // Load BUILD_VERIFIED SHA-256 identities emitted by the inspect-rc3 job.
        // These are asserted — upload fails if the actual file does not match.
        // Eliminates the manually maintained hardcoded hash table.
        const identitiesPath = 'downloaded/identities/verified-identities.json';
        if (!fs.existsSync(identitiesPath)) {
          console.error('❌ verified-identities.json not found — inspect-rc3 must pass before promotion');
          process.exit(1);
        }
        const identities = JSON.parse(fs.readFileSync(identitiesPath, 'utf8'));
        console.log('Loaded verified identities:', JSON.stringify(identities, null, 2));

        // Map inspection target labels to platform keys
        const EXPECTED = {
          'mac-arm64':   identities['macOS arm64'],
          'windows-x64': identities['Windows x64'],
        };
        if (!EXPECTED['mac-arm64'] || !EXPECTED['windows-x64']) {
          console.error('❌ verified-identities.json missing expected platform entries');
          process.exit(1);
        }

        async function main() {
          const macZip  = findFile('downloaded/macos',   'VaultBasis-RC3-macOS-arm64.zip');
          const winZip  = findFile('downloaded/windows', 'VaultBasis-RC3-Windows-x64.zip');

          if (!macZip || !winZip) {
            console.error('❌ Could not locate one or both ZIP files');
            process.exit(1);
          }

          const artifacts = [
            { platformKey: 'mac-arm64',   os: 'macos',   architecture: 'arm64', filePath: macZip,  filename: 'VaultBasis-RC3-macOS-arm64.zip'  },
            { platformKey: 'windows-x64', os: 'windows', architecture: 'x64',   filePath: winZip,  filename: 'VaultBasis-RC3-Windows-x64.zip'  },
          ];

          const manifestArtifacts = [];

          for (const art of artifacts) {
            const actual = sha256File(art.filePath);
            const expected = EXPECTED[art.platformKey];

            if (actual !== expected) {
              console.error(`❌ SHA-256 MISMATCH for ${art.platformKey}`);
              console.error(`   Expected: ${expected}`);
              console.error(`   Actual:   ${actual}`);
              console.error('   Artifact identity does not match BUILD_VERIFIED record. Aborting.');
              process.exit(1);
            }
            console.log(`✓ SHA-256 verified: ${art.platformKey} = ${actual}`);

            // Immutable content-addressed path: rc3/<short-commit>/<platform>/<sha256>/<filename>
            const blobPathname = `rc3/${SHORT_COMMIT}/${art.platformKey}/${actual}/${art.filename}`;

            console.log(`  Uploading to: ${blobPathname}`);
            const result = await put(blobPathname, fs.readFileSync(art.filePath), {
              access: 'private',
              addRandomSuffix: false,
            });
            console.log(`✓ Uploaded: ${result.pathname}`);

            manifestArtifacts.push({
              os:             art.os,
              architecture:   art.architecture,
              platformKey:    art.platformKey,
              filename:       art.filename,
              blobPathname:   result.pathname,
              sha256:         actual,
              sourceCommit:   COMMIT,
              ciRunId:        RUN_ID,
              qualification:  'BUILD_VERIFIED',
              promotedAt:     PROMOTED_AT,
            });
          }

          const manifest = {
            version:       '1',
            qualification: 'BUILD_VERIFIED',
            sourceCommit:  COMMIT,
            ciRunId:       RUN_ID,
            promotedAt:    PROMOTED_AT,
            artifacts:     manifestArtifacts,
          };

          const manifestJson = JSON.stringify(manifest, null, 2);
          const manifestPathname = `rc3/${SHORT_COMMIT}/manifest.json`;

          console.log(`  Uploading manifest to: ${manifestPathname}`);
          const mResult = await put(manifestPathname, manifestJson, {
            access: 'private',
            addRandomSuffix: false,
            contentType: 'application/json',
          });
          console.log(`✓ Manifest uploaded: ${mResult.pathname}`);

          // Write manifest pathname to a well-known stable pointer (also in private blob)
          // This is the only path download.js needs to know: rc3/current/manifest.json
          // It is overwritten on each promotion — always points to the latest BUILD_VERIFIED set
          const pointerResult = await put('rc3/current/manifest.json', manifestJson, {
            access: 'private',
            addRandomSuffix: false,
            contentType: 'application/json',
          });
          console.log(`✓ Current pointer updated: ${pointerResult.pathname}`);

          console.log('\n✅ store-rc3 complete. Manifest:');
          console.log(manifestJson);
          console.log('\nArtifacts are in private Blob storage. No manifest committed to main.');
        }

        main().catch(e => { console.error(e); process.exit(1); });
        JSEOF

