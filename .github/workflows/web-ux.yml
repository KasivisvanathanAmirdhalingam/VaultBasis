name: MMP11 Web UX Qualification
on:
  push:
    branches: [fix/mmp11-ux-001]
  pull_request:
    branches: [release/mmp-1.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Task traceability
        run: python3 scripts/check_task_traceability.py
      - name: Protected subsystem unchanged
        run: |
          git fetch origin release/mmp-1.1
          git diff --exit-code origin/release/mmp-1.1...HEAD -- edge/assurance edge/connectors edge/receipts schemas apps/verifier apps/web-verifier tests/quality/golden tests/fixtures
      - name: Generated public web
        run: npm run build
      - name: Full Python regression
        run: python3 -m pytest -q
      - name: Canonical eleven gates
        run: bash scripts/validate_before_commit.sh
      - name: JavaScript security regressions
        run: |
          node tests/unit/test_sec002_entitlement_auth.js
          node tests/unit/test_sec003_host_poisoning.js
          node --test tests/unit/test_manual_access.js
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Generated-output interactions, reflow, axe and negative controls
        run: npm run test:ux
      - name: Retain exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ux-evidence-${{ github.sha }}
          path: test-results/
          retention-days: 14

# This workflow never deploys, promotes, assigns human acceptance or builds Edge.
