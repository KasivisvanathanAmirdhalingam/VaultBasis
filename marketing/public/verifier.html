<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VaultBasis Independent Verifier</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; line-height: 1.5; }
        .box { border: 1px solid #ccc; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .success { border-color: #10b981; background: #ecfdf5; color: #065f46; }
        .error { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
        .status-badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-weight: bold; font-size: 0.875rem; }
    </style>
</head>
<body>
    <h1>VaultBasis Independent Receipt Verifier</h1>
    <p>Select a VaultBasis Outcome Receipt (.json) to verify locally in your browser.</p>
    
    <input type="file" id="receiptInput" accept=".json">
    
    <div id="result" class="box" style="display: none; margin-top: 2rem;">
        <h2 style="margin-top:0">Verification Result</h2>
        <p>Overall Status: <span id="statusBadge" class="status-badge"></span></p>
        <p><strong>Outcome State:</strong> <span id="outcomeState"></span></p>
        <div id="details" style="font-size: 0.875rem; color: #4b5563; margin-top: 1rem;"></div>
    </div>

    <script>
        const KNOWN_OUTCOME_STATES = [
            "MATCHED", "UNRESOLVED_DATA", "EXACT_DUPLICATE", "CONFLICTING_DUPLICATE",
            "BASIS_DIFFERENCE", "PROCEEDS_DIFFERENCE", "QUANTITY_DIFFERENCE", "DATE_DIFFERENCE",
            "MULTIPLE_DIFFERENCES"
        ];

        // RFC 8785 Canonical JSON implementation in JS
        function canonicalize(val) {
            if (val === null || typeof val !== 'object') {
                if (typeof val === 'number') {
                    // Avoid exponential notation, standard JS toString is usually fine for integers
                    return val.toString();
                }
                return JSON.stringify(val);
            }
            if (Array.isArray(val)) {
                let res = '[';
                for (let i = 0; i < val.length; i++) {
                    res += (i > 0 ? ',' : '') + canonicalize(val[i]);
                }
                return res + ']';
            }
            
            const keys = Object.keys(val).sort();
            let res = '{';
            let first = true;
            for (const k of keys) {
                if (val[k] === undefined) continue;
                if (!first) res += ',';
                first = false;
                res += JSON.stringify(k) + ':' + canonicalize(val[k]);
            }
            return res + '}';
        }

        function hexToBytes(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
            }
            return bytes;
        }

        async function verifyReceipt(receipt) {
            const result = {
                schema_status: "VALID", contract_status: "VALID", 
                canonicalization_status: "VALID", signature_status: "VALID", overall_status: "VALID"
            };

            if (receipt.receipt_version !== "v0.1") {
                result.contract_status = "UNSUPPORTED_CONTRACT";
                result.overall_status = "UNSUPPORTED_CONTRACT";
                return result;
            }

            if (!KNOWN_OUTCOME_STATES.includes(receipt.outcome_state)) {
                result.schema_status = "INVALID_SCHEMA";
                result.overall_status = "INVALID_SCHEMA";
                return result;
            }

            if (!receipt.case_id || !receipt.outcome_state || !receipt.signer_public_key || !receipt.signature) {
                result.schema_status = "INVALID_SCHEMA";
                result.overall_status = "INVALID_SCHEMA";
                return result;
            }

            const pubKeyHex = receipt.signer_public_key;
            const sigHex = receipt.signature;
            const signatureBytes = hexToBytes(sigHex);
            const pubKeyBytes = hexToBytes(pubKeyHex);

            // Create a payload without the signature
            const payload = { ...receipt };
            delete payload.signature;

            // 1. Canonicalize
            const canonicalStr = canonicalize(payload);
            const encoder = new TextEncoder();
            const canonicalBytes = encoder.encode(canonicalStr);

            // 2. Hash canonical bytes (SHA-256)
            const digest = await crypto.subtle.digest("SHA-256", canonicalBytes);

            // 3. Verify Ed25519 signature over the SHA-256 digest
            let cryptoKey;
            try {
                // To import raw Ed25519 key in WebCrypto
                cryptoKey = await crypto.subtle.importKey(
                    "raw",
                    pubKeyBytes,
                    { name: "Ed25519" },
                    false,
                    ["verify"]
                );
            } catch (e) {
                result.signature_status = "INVALID_SIGNATURE";
                result.overall_status = "INVALID_SIGNATURE";
                return result;
            }

            try {
                const isValid = await crypto.subtle.verify(
                    { name: "Ed25519" },
                    cryptoKey,
                    signatureBytes,
                    digest // We sign the 32-byte SHA-256 digest
                );
                
                if (!isValid) {
                    result.signature_status = "INVALID_SIGNATURE";
                    result.overall_status = "INVALID_SIGNATURE";
                }
            } catch (e) {
                result.signature_status = "INVALID_SIGNATURE";
                result.overall_status = "INVALID_SIGNATURE";
            }

            return result;
        }

        document.getElementById('receiptInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const text = await file.text();
            let receipt;
            try {
                receipt = JSON.parse(text);
            } catch(e) {
                alert("Invalid JSON file");
                return;
            }

            const res = await verifyReceipt(receipt);
            
            const box = document.getElementById('result');
            const badge = document.getElementById('statusBadge');
            box.style.display = 'block';
            
            if (res.overall_status === "VALID") {
                box.className = "box success";
                badge.style.backgroundColor = "#10b981";
                badge.style.color = "white";
                badge.textContent = "VALID";
            } else {
                box.className = "box error";
                badge.style.backgroundColor = "#ef4444";
                badge.style.color = "white";
                badge.textContent = res.overall_status;
            }

            document.getElementById('outcomeState').textContent = receipt.outcome_state || "UNKNOWN";
            document.getElementById('details').textContent = JSON.stringify(res, null, 2);
        });
    </script>
</body>
</html>
