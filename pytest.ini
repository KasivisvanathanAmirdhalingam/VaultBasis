[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Fast smoke test suite validating core critical paths (<2s).
    regression: Comprehensive regression test suite covering all edge cases, malformed inputs, and invariants.
    atdd: Acceptance Test-Driven Development scenarios (CPA workflows, design-partner user journeys).
    bdd: Behavior-Driven Development Gherkin-style scenarios verifying PRD §41 AC-01 through AC-07.
    tdd: Test-Driven Development tests for mathematical, canonicalization, and cryptographic invariants.
    ddd: Domain-Driven Design aggregate, entity, and bounded context invariants.
filterwarnings =
    ignore::DeprecationWarning
